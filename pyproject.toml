[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csfdata_analysis"
version = "0.1.0"
description = "Optional analysis add-ons for CSFData simulation catalogues."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Juan Farias" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "csfdata>=0.1.0",
]

[project.entry-points."csfdata.analysis"]
csfdata_analysis = "csfdata_analysis"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mkdocs>=1.6",
  "mkdocs-material",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
